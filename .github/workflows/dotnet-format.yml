name: dotnet format
on:
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Format
        run: dotnet format --no-restore --verify-no-changes
